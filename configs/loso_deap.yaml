# Initial runnable defaults; verify against the final manuscript protocol.
seed: 42
augmentation:
  noise_std: 0.05
  max_time_shift_fraction: 0.05
  frequency_mask_probability: 0.20
  channel_dropout_probability: 0.0
model:
  cnn_channels: 32
  spatial_dim: 64
  gcn_hidden_dim: 64
  temporal_dim: 128
  temporal_layers: 2
  temporal_heads: 4
  temporal_ff_dim: 256
  fusion_dim: 128
  projection_hidden_dim: 128
  projection_dim: 64
  classifier_hidden_dim: 64
  dropout: 0.1
  gcn_dropout: 0.3
  contrastive_temperature: 0.1
training:
  batch_size: 32
  eval_batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  lambda_contrastive: 0.1
  max_epochs: 100
  patience: 15
  gradient_clip_norm: 1.0
  validation_subject_count: 1
  num_workers: 0
