dataset: DEAP
mat_data_key: data
mat_labels_key: labels
sampling_rate_hz: 128  # Confirm against the downloaded release.
selected_channels: [Fp1, Fp2, F3, Fz, F4, C3, Cz, C4, P3, Pz, P4]
bandpass:
  low_hz: 4.0
  high_hz: 30.0
  order: 4
segmentation:
  window_seconds: 3.0
  overlap_seconds: 0.0
normalization:
  method: channel_zscore
  fit_scope: training_subjects_only
artifact_removal:
  method: manual_ica
  exclude_components: []  # Fill only after documented component inspection.
